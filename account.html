<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Profile — Publik</title>
<style>
  :root{
    --bg:#1B1B26;
    --ink:#F5F5F2;
    --ink-soft:#9C9AA8;
    --lime:#D6FF3F;
    --border:rgba(255,255,255,.14);
    --card-bg:#111116;
    --danger:#FF6B6B;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:6vh 6vw 10vh;
  }
  .wrap{ max-width:440px; margin:0 auto; }
  .back-link{ display:inline-block; color:var(--ink-soft); font-size:.85rem; text-decoration:none; margin-bottom:24px; }
  .back-link:hover{ color:var(--lime); }

  h1{ font-size:1.8rem; font-weight:800; margin-bottom:8px; }
  .hint{ color:var(--ink-soft); font-size:.95rem; margin-bottom:30px; line-height:1.5; }

  .balance-card{
    background:var(--card-bg); border:1px solid var(--border); border-radius:18px;
    padding:28px; text-align:center; margin-bottom:24px;
  }
  .balance-card .points{ font-size:3rem; font-weight:800; color:var(--lime); line-height:1; }
  .balance-card .label{ color:var(--ink-soft); font-size:.85rem; margin-top:6px; }
  .balance-card .email-shown{ color:var(--ink-soft); font-size:.82rem; margin-top:10px; word-break:break-all; }

  .lookup-box{
    background:var(--card-bg); border:1px solid var(--border); border-radius:14px;
    padding:20px; margin-bottom:24px;
  }

  label{
    display:block; font-size:.78rem; font-weight:700; letter-spacing:.03em;
    text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; margin-top:20px;
  }
  .lookup-box label{ margin-top:0; }
  input[type=email]{
    width:100%; background:var(--bg); border:1px solid var(--border);
    color:var(--ink); padding:12px 14px; border-radius:10px; font-size:1rem;
    font-family:inherit;
  }
  input[type=email]:focus{ outline:none; border-color:var(--lime); }

  .consent-row{
    display:flex; align-items:flex-start; gap:8px; margin-top:12px; font-size:.78rem;
    color:var(--ink-soft); line-height:1.5;
  }
  .consent-row input{ margin-top:3px; flex-shrink:0; }

  .primary-btn{
    width:100%; margin-top:16px; padding:14px; border-radius:12px; border:none;
    background:var(--lime); color:#111; font-weight:800; font-size:.95rem; cursor:pointer;
  }
  .primary-btn:active{ transform:scale(.98); }
  .primary-btn:disabled{ opacity:.5; cursor:not-allowed; }

  .link-btn{
    display:block; text-align:center; margin-top:16px; font-size:.85rem; color:var(--ink-soft);
    background:none; border:none; cursor:pointer; text-decoration:underline;
    font-family:inherit;
  }
  .link-btn:hover{ color:var(--lime); }

  .status{ margin-top:14px; font-size:.85rem; text-align:center; min-height:1.2em; }
  .status.ok{ color:var(--lime); }
  .status.err{ color:var(--danger); }

  .center-msg{ text-align:center; padding-top:12vh; color:var(--ink-soft); }
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <a class="back-link" href="index.html">&larr; Back to Publik</a>
  <h1>Your Profile</h1>
  <div class="hint">Tap a Publik card and enter your email there to start earning points. Enter that same email below any time to check your balance.</div>
  <div id="content"></div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  const content = document.getElementById('content');
  const TOKEN_KEY = 'publik_customer_token';

  function showMessage(text) {
    content.innerHTML = `<div class="center-msg">${text}</div>`;
  }

  function supabaseConfigured() {
    const c = window.PUBLIK_CONFIG || {};
    return c.SUPABASE_URL && c.SUPABASE_ANON_KEY &&
      !c.SUPABASE_URL.includes('PASTE_') && !c.SUPABASE_ANON_KEY.includes('PASTE_');
  }

  function renderLookup() {
    content.innerHTML = `
      <div class="lookup-box">
        <label>Your email</label>
        <input type="email" id="emailInput" placeholder="name@email.com">
        <label class="consent-row" style="text-transform:none;letter-spacing:normal;font-weight:400;">
          <input type="checkbox" id="lookupConsent">
          <span>I agree to share my email so Publik can look up and show my reward points.</span>
        </label>
        <button type="button" class="primary-btn" id="lookupBtn" disabled>View my rewards</button>
        <div class="status" id="lookupStatus"></div>
      </div>
    `;
    const btn = document.getElementById('lookupBtn');
    const input = document.getElementById('emailInput');
    const status = document.getElementById('lookupStatus');
    const consent = document.getElementById('lookupConsent');

    consent.addEventListener('change', function () {
      btn.disabled = !consent.checked;
    });

    btn.onclick = function () {
      const email = (input.value || '').trim();
      if (!consent.checked) {
        status.textContent = 'Please check the box to agree first.';
        status.className = 'status err';
        return;
      }
      if (!email || email.indexOf('@') === -1) {
        status.textContent = 'Enter a valid email first.';
        status.className = 'status err';
        return;
      }
      btn.disabled = true;
      status.textContent = 'Looking it up…';
      status.className = 'status';

      client.rpc('restore_customer_by_email', { p_email: email }).then(function (res) {
        btn.disabled = false;
        if (res.error || !res.data || !res.data[0]) {
          status.textContent = "No points found for this email yet. Tap a Publik card and enter this same email to start earning.";
          status.className = 'status err';
          return;
        }
        const row = res.data[0];
        localStorage.setItem(TOKEN_KEY, row.token);
        renderBalance(row.points, email);
      }).catch(function () {
        btn.disabled = false;
        status.textContent = 'Something went wrong. Try again.';
        status.className = 'status err';
      });
    };
  }

  function renderBalance(points, email) {
    content.innerHTML = `
      <div class="balance-card">
        <div class="points">${points}</div>
        <div class="label">${points === 1 ? 'point earned' : 'points earned'}</div>
        <div class="email-shown">Linked to ${email}</div>
      </div>
      <button type="button" class="link-btn" id="checkAnotherBtn">Check a different email</button>
    `;
    document.getElementById('checkAnotherBtn').onclick = renderLookup;
  }

  if (!supabaseConfigured() || !window.supabase) {
    showMessage("Your Profile isn't connected yet.");
    return;
  }

  const client = window.supabase.createClient(window.PUBLIK_CONFIG.SUPABASE_URL, window.PUBLIK_CONFIG.SUPABASE_ANON_KEY);

  showMessage('Loading…');
  Promise.resolve(client.rpc('get_points_enabled')).then(function (res) {
    const enabled = !res.error && res.data === true;
    if (!enabled) {
      showMessage("Rewards aren't available right now — check back soon.");
      return;
    }
    renderLookup();
  }).catch(function () {
    showMessage("Couldn't reach the server. Check your connection and reload.");
  });
})();
</script>

</body>
</html>
