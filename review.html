<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publik — Leave a review</title>
<style>
  :root{
    --bg:#06060B;
    --ink:#F5F5F2;
    --ink-soft:#9C9AA8;
    --lime:#D6FF3F;
    --border:rgba(255,255,255,.14);
    --card-bg:#111116;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:8vh 6vw 10vh;
  }
  .wrap{ max-width:420px; margin:0 auto; }
  .badge{
    width:48px; height:48px; background:var(--lime); border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#111; margin-bottom:20px;
  }
  h1{ font-size:1.35rem; font-weight:800; margin-bottom:6px; }
  .hint{ color:var(--ink-soft); font-size:.88rem; margin-bottom:30px; line-height:1.5; }
  label{
    display:block; font-size:.78rem; font-weight:700; letter-spacing:.03em;
    text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; margin-top:20px;
  }
  input[type=text], textarea{
    width:100%; background:var(--card-bg); border:1px solid var(--border);
    color:var(--ink); padding:12px 14px; border-radius:10px; font-size:.95rem;
    font-family:inherit;
  }
  textarea{ resize:vertical; min-height:110px; }
  input[type=text]:focus, textarea:focus{ outline:none; border-color:var(--lime); }

  .submit-btn{
    width:100%; margin-top:28px; padding:16px; border-radius:12px; border:none;
    background:var(--lime); color:#111; font-weight:800; font-size:1rem; cursor:pointer;
  }
  .submit-btn:disabled{ opacity:.5; }
  .status{ margin-top:14px; font-size:.85rem; text-align:center; min-height:1.2em; color:var(--ink-soft); }
  .status.ok{ color:var(--lime); }
  .status.err{ color:#FF6B6B; }

  .thanks{ text-align:center; padding-top:14vh; }
  .thanks h1{ margin-bottom:10px; }
  .thanks p{ color:var(--ink-soft); font-size:.95rem; }
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="badge">P</div>
  <h1>Leave a review</h1>
  <div class="hint">Tell us what you thought of working with Publik — we read every one, and may feature it on our site.</div>

  <label>Your name</label>
  <input type="text" id="nameInput" placeholder="Your name">

  <label>Business / company (optional)</label>
  <input type="text" id="companyInput" placeholder="Your business name">

  <label>Your review</label>
  <textarea id="quoteInput" placeholder="What was it like working with us?"></textarea>

  <button type="button" class="submit-btn" id="submitBtn">Submit review</button>
  <div class="status" id="statusMsg"></div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  function supabaseConfigured() {
    const c = window.PUBLIK_CONFIG || {};
    return c.SUPABASE_URL && c.SUPABASE_ANON_KEY &&
      !c.SUPABASE_URL.includes('PASTE_') && !c.SUPABASE_ANON_KEY.includes('PASTE_');
  }

  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');

  if (!supabaseConfigured() || !window.supabase) {
    submitBtn.disabled = true;
    statusMsg.textContent = "Reviews aren't connected yet.";
    statusMsg.className = 'status err';
    return;
  }

  const client = window.supabase.createClient(window.PUBLIK_CONFIG.SUPABASE_URL, window.PUBLIK_CONFIG.SUPABASE_ANON_KEY);

  submitBtn.addEventListener('click', function () {
    const name = document.getElementById('nameInput').value.trim();
    const company = document.getElementById('companyInput').value.trim();
    const quote = document.getElementById('quoteInput').value.trim();

    if (!name || !quote) {
      statusMsg.textContent = 'Please add your name and a review.';
      statusMsg.className = 'status err';
      return;
    }

    submitBtn.disabled = true;
    statusMsg.textContent = 'Submitting…';
    statusMsg.className = 'status';

    client.rpc('submit_testimonial', { p_name: name, p_company: company, p_quote: quote })
      .then(function (res) {
        if (res.error) {
          submitBtn.disabled = false;
          statusMsg.textContent = 'Something went wrong. Try again.';
          statusMsg.className = 'status err';
          return;
        }
        document.getElementById('wrap').innerHTML = `
          <div class="thanks">
            <div class="badge" style="margin:0 auto 20px;">P</div>
            <h1>Thank you!</h1>
            <p>Your review has been submitted.</p>
          </div>
        `;
      })
      .catch(function () {
        submitBtn.disabled = false;
        statusMsg.textContent = 'Something went wrong. Try again.';
        statusMsg.className = 'status err';
      });
  });
})();
</script>

</body>
</html>
