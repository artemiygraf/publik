<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publik — Edit your page</title>
<style>
  :root{
    --bg:#06060B;
    --ink:#F5F5F2;
    --ink-soft:#9C9AA8;
    --lime:#D6FF3F;
    --border:rgba(255,255,255,.14);
    --card-bg:#111116;
    --danger:#FF6B6B;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:6vh 6vw 10vh;
  }
  .wrap{ max-width:460px; margin:0 auto; }
  .badge{
    width:44px; height:44px; background:var(--lime); border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#111; margin-bottom:18px;
  }
  h1{ font-size:1.3rem; font-weight:800; margin-bottom:4px; }
  .hint{ color:var(--ink-soft); font-size:.85rem; margin-bottom:28px; }
  label{
    display:block; font-size:.78rem; font-weight:700; letter-spacing:.03em;
    text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; margin-top:20px;
  }
  input[type=text], textarea{
    width:100%; background:var(--card-bg); border:1px solid var(--border);
    color:var(--ink); padding:12px 14px; border-radius:10px; font-size:.95rem;
    font-family:inherit;
  }
  textarea{ resize:vertical; min-height:64px; }
  input[type=text]:focus, textarea:focus{ outline:none; border-color:var(--lime); }

  .photo-row{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .photo-preview{
    width:56px; height:56px; border-radius:14px; background:var(--card-bg);
    border:1px solid var(--border); overflow:hidden; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:.8rem;
  }
  .photo-preview img{ width:100%; height:100%; object-fit:cover; }
  .btn-file{
    background:var(--card-bg); border:1px solid var(--border); color:var(--ink);
    padding:9px 14px; border-radius:9px; font-size:.85rem; font-weight:700; cursor:pointer;
  }
  input[type=file]{ display:none; }

  .link-card{
    background:var(--card-bg); border:1px solid var(--border); border-radius:12px;
    padding:14px; margin-top:12px;
  }
  .link-card .row{ display:flex; gap:10px; align-items:center; }
  .link-card label{ margin-top:12px; }
  .link-card label:first-of-type{ margin-top:0; }
  .remove-link{
    background:none; border:none; color:var(--danger); font-size:.8rem; font-weight:700;
    cursor:pointer; margin-top:12px;
  }
  .link-card-head{
    display:flex; align-items:center; gap:8px; color:var(--ink-soft); font-size:.75rem;
    font-weight:700; letter-spacing:.03em; text-transform:uppercase;
  }
  .drag-handle{
    cursor:grab; font-size:1.15rem; line-height:1; color:var(--ink-soft);
    user-select:none; touch-action:none; padding:2px 4px;
  }
  .drag-handle:active{ cursor:grabbing; }
  .link-card.sortable-ghost{ opacity:.35; }
  .link-card.sortable-drag{ box-shadow:0 6px 18px rgba(0,0,0,.4); }

  .add-link{
    width:100%; margin-top:14px; padding:14px; border-radius:12px;
    border:1.5px dashed var(--border); background:none; color:var(--ink-soft);
    font-weight:700; font-size:.9rem; cursor:pointer;
  }
  .add-link:hover{ border-color:var(--lime); color:var(--lime); }

  .save-btn{
    width:100%; margin-top:32px; padding:16px; border-radius:12px; border:none;
    background:var(--lime); color:#111; font-weight:800; font-size:1rem; cursor:pointer;
  }
  .save-btn:active{ transform:scale(.98); }
  .save-btn:disabled{ opacity:.5; }

  .status{ margin-top:14px; font-size:.85rem; text-align:center; min-height:1.2em; }
  .status.ok{ color:var(--lime); }
  .status.err{ color:var(--danger); }

  .view-link{ display:block; text-align:center; margin-top:10px; font-size:.85rem; color:var(--ink-soft); }
  .view-link a{ color:var(--lime); }

  .center-msg{ text-align:center; padding-top:12vh; color:var(--ink-soft); }

  /* tabs */
  .tab-bar{
    display:flex; gap:8px; margin-top:28px; background:var(--card-bg);
    border:1px solid var(--border); border-radius:12px; padding:4px;
  }
  .tab-btn{
    flex:1; padding:10px; border-radius:9px; border:none; background:none;
    color:var(--ink-soft); font-weight:700; font-size:.88rem; cursor:pointer;
  }
  .tab-btn.active{ background:var(--lime); color:#111; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  /* posts */
  .post-form{
    background:var(--card-bg); border:1px solid var(--border); border-radius:12px;
    padding:14px; margin-top:14px;
  }
  .publish-btn{
    width:100%; margin-top:14px; padding:12px; border-radius:10px; border:none;
    background:var(--ink); color:#111; font-weight:800; font-size:.9rem; cursor:pointer;
  }
  .publish-btn:disabled{ opacity:.5; }

  .post-list{ margin-top:20px; }
  .post-item{
    background:var(--card-bg); border:1px solid var(--border); border-radius:12px;
    padding:14px; margin-top:10px;
  }
  .post-item img{ width:100%; border-radius:9px; margin-bottom:10px; max-height:160px; object-fit:cover; }
  .post-item .ptitle{ font-weight:800; font-size:.95rem; }
  .post-item .pbody{ color:var(--ink-soft); font-size:.85rem; margin-top:4px; line-height:1.4; }
  .post-item .pmeta{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .post-item .pwhen{ color:var(--ink-soft); font-size:.75rem; }
  .post-item .pdelete{
    background:none; border:none; color:var(--danger); font-size:.78rem; font-weight:700; cursor:pointer;
  }
  .post-item .pedit{
    background:none; border:none; color:var(--lime); font-size:.78rem; font-weight:700; cursor:pointer; margin-right:14px;
  }
  .post-item .ppin{
    background:none; border:none; color:var(--ink-soft); font-size:.78rem; font-weight:700; cursor:pointer; margin-right:14px;
  }
  .post-item .ppin.is-pinned{ color:var(--lime); }
  .post-item .pactions{ display:flex; align-items:center; }
  .pinned-badge{
    display:inline-block; color:var(--lime); font-size:.72rem; font-weight:800;
    letter-spacing:.03em; text-transform:uppercase; margin-bottom:4px;
  }
  .cancel-edit-btn{
    background:none; border:none; color:var(--ink-soft); font-size:.8rem; font-weight:700;
    cursor:pointer; margin-top:10px; text-decoration:underline;
  }
  .empty-posts{ color:var(--ink-soft); font-size:.85rem; margin-top:16px; }

  .clamp-text{
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .clamp-text.expanded{
    -webkit-line-clamp:unset;
    overflow:visible;
  }
  .read-more-btn{
    background:none; border:none; color:var(--lime); font-size:.78rem; font-weight:700;
    cursor:pointer; padding:4px 0 0; display:block;
  }
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="center-msg" id="state">Loading&hellip;</div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const key = params.get('key');
  const wrap = document.getElementById('wrap');
  const PUBLIK_OWN_CARD_ID = 'xdpk1n9j';
  const isPublikAccount = id === PUBLIK_OWN_CARD_ID;

  function supabaseConfigured() {
    const c = window.PUBLIK_CONFIG || {};
    return c.SUPABASE_URL && c.SUPABASE_ANON_KEY &&
      !c.SUPABASE_URL.includes('PASTE_') && !c.SUPABASE_ANON_KEY.includes('PASTE_');
  }

  function showMessage(text) {
    wrap.innerHTML = `<div class="center-msg">${text}</div>`;
  }

  if (!id || !key) {
    showMessage("This edit link is missing its access key. Ask Publik for your full edit link.");
    return;
  }

  if (!supabaseConfigured() || !window.supabase) {
    showMessage("Editing isn't connected yet. Ask Publik to finish setup.");
    return;
  }

  const client = window.supabase.createClient(window.PUBLIK_CONFIG.SUPABASE_URL, window.PUBLIK_CONFIG.SUPABASE_ANON_KEY);
  let pointsEnabled = false;

  function fileToDataURI(file, maxDim, quality) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onload = function () {
        const img = new Image();
        img.onload = function () {
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
          else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality || 0.72));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + 'h ago';
    const days = Math.floor(hours / 24);
    return days + 'd ago';
  }

  function renderForm(data) {
    let links = (data.links || []).slice();
    let posts = [];

    wrap.innerHTML = `
      <div class="badge">P</div>
      <h1>Edit your page</h1>
      <div class="hint">Changes go live as soon as you save — this is what everyone sees when they tap your card.</div>

      <label>Photo / logo</label>
      <div class="photo-row">
        <div class="photo-preview" id="photoPreview">${data.photo ? `<img src="${data.photo}">` : 'None'}</div>
        <button type="button" class="btn-file" id="photoBtn">Upload image</button>
        <input type="file" id="photoInput" accept="image/*">
      </div>

      <label>Business name</label>
      <input type="text" id="businessInput" value="${(data.business || '').replace(/"/g, '&quot;')}" placeholder="Your business name">

      <label>Location link</label>
      <input type="text" id="locationInput" value="${(data.location_url || '').replace(/"/g, '&quot;')}" placeholder="Paste your Google Maps link">

      <div class="tab-bar">
        <button type="button" class="tab-btn active" data-tab="card">NFC Card</button>
        <button type="button" class="tab-btn" data-tab="profile">Profile</button>
        ${pointsEnabled ? `<button type="button" class="tab-btn" data-tab="redeem">Redeem</button>` : ''}
      </div>

      <div class="tab-panel active" id="tabCard">
        <label>Short description</label>
        <textarea id="taglineInput" placeholder="What you do, in a line or two">${data.tagline || ''}</textarea>

        <label>Links</label>
        <div id="linksList"></div>
        <button type="button" class="add-link" id="addLinkBtn">+ Add a link</button>
      </div>

      <div class="tab-panel" id="tabProfile">
        <label>About your business</label>
        <textarea id="descriptionInput" placeholder="Tell customers who you are, what makes you different, your story...">${data.description || ''}</textarea>

        <label>Post an update (offers, events, news)</label>
        <div class="post-form">
          <label style="margin-top:0;">Title</label>
          <input type="text" id="postTitleInput" placeholder="e.g. Happy hour every Friday">
          <label>Details</label>
          <textarea id="postBodyInput" placeholder="Tell people about it"></textarea>
          <label>Image (optional)</label>
          <div class="photo-row">
            <div class="photo-preview" id="postImgPreview">None</div>
            <button type="button" class="btn-file" id="postImgBtn">Upload image</button>
            <input type="file" id="postImgInput" accept="image/*">
          </div>
          <label>Link (optional — where should the button take people?)</label>
          <input type="text" id="postLinkInput" placeholder="https://... e.g. a map, menu, or offer page">
          <button type="button" class="publish-btn" id="publishBtn">Publish update</button>
          <div class="status" id="postStatus"></div>
        </div>

        <div class="post-list" id="postList"></div>
      </div>

      ${pointsEnabled ? `
      <div class="tab-panel" id="tabRedeem">
        <div class="hint" style="margin-bottom:0;">Ask the customer for the email they used to save their points, and how many points they say they have. This must match before anything is deducted.</div>

        <label>Customer's email</label>
        <input type="text" id="redeemEmailInput" placeholder="name@email.com">
        <label>What they say their balance is</label>
        <input type="text" id="redeemClaimedInput" placeholder="e.g. 12" inputmode="numeric">
        <label>Points to redeem</label>
        <input type="text" id="redeemAmountInput" placeholder="e.g. 5" inputmode="numeric">
        <button type="button" class="publish-btn" id="redeemBtn">Redeem points</button>
        <div class="status" id="redeemStatus"></div>
      </div>
      ` : ''}

      <button type="button" class="save-btn" id="saveBtn">Save changes</button>
      <div class="status" id="statusMsg"></div>
      <div class="view-link">See your live page: <a href="p.html?id=${encodeURIComponent(id)}" target="_blank">p.html?id=${id}</a></div>
      <div class="view-link">See your profile: <a href="profile.html?id=${encodeURIComponent(id)}" target="_blank">profile.html?id=${id}</a></div>
      <div class="view-link">See your stats: <a href="stats.html?id=${encodeURIComponent(id)}&key=${encodeURIComponent(key)}" target="_blank">stats.html</a></div>
    `;

    // --- tabs ---
    const tabPanelIds = { card: 'tabCard', profile: 'tabProfile', redeem: 'tabRedeem' };
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.onclick = function () {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        const panel = document.getElementById(tabPanelIds[btn.dataset.tab]);
        if (panel) panel.classList.add('active');
      };
    });

    // --- redeem points ---
    if (pointsEnabled) {
      const redeemBtn = document.getElementById('redeemBtn');
      if (redeemBtn) {
        redeemBtn.onclick = function () {
          const emailEl = document.getElementById('redeemEmailInput');
          const claimedEl = document.getElementById('redeemClaimedInput');
          const amountEl = document.getElementById('redeemAmountInput');
          const status = document.getElementById('redeemStatus');
          const email = emailEl.value.trim();
          const claimed = parseInt(claimedEl.value, 10);
          const amount = parseInt(amountEl.value, 10);

          if (!email || email.indexOf('@') === -1) {
            status.textContent = "Enter the customer's email.";
            status.className = 'status err';
            return;
          }
          if (isNaN(claimed) || isNaN(amount)) {
            status.textContent = 'Enter valid numbers for both point fields.';
            status.className = 'status err';
            return;
          }

          redeemBtn.disabled = true;
          status.textContent = 'Checking…';
          status.className = 'status';

          client.rpc('redeem_points', {
            p_id: id, p_key: key, p_email: email, p_claimed_points: claimed, p_redeem_amount: amount
          }).then(function (res) {
            redeemBtn.disabled = false;
            if (res.error || !res.data || !res.data[0]) {
              status.textContent = 'Something went wrong. Try again.';
              status.className = 'status err';
              return;
            }
            const row = res.data[0];
            status.textContent = row.message + (row.new_balance !== null && row.new_balance !== undefined ? ' (' + row.new_balance + ' points left)' : '');
            status.className = row.ok ? 'status ok' : 'status err';
            if (row.ok) {
              emailEl.value = '';
              claimedEl.value = '';
              amountEl.value = '';
            }
          }).catch(function () {
            redeemBtn.disabled = false;
            status.textContent = 'Something went wrong. Try again.';
            status.className = 'status err';
          });
        };
      }
    }

    // --- photo ---
    let photoData = data.photo || '';
    document.getElementById('photoBtn').onclick = function () {
      document.getElementById('photoInput').click();
    };
    document.getElementById('photoInput').onchange = function (e) {
      const file = e.target.files[0];
      if (!file) return;
      fileToDataURI(file, 300).then(function (uri) {
        photoData = uri;
        document.getElementById('photoPreview').innerHTML = `<img src="${uri}">`;
      });
    };

    // --- links ---
    const linksList = document.getElementById('linksList');

    function renderLinks() {
      linksList.innerHTML = '';
      links.forEach(function (link, i) {
        const card = document.createElement('div');
        card.className = 'link-card';
        card.innerHTML = `
          <div class="link-card-head">
            <span class="drag-handle" title="Drag to reorder">&#9776;</span>
            <span>Link ${i + 1}</span>
          </div>
          <label>Label (e.g. "Leave a review")</label>
          <input type="text" data-field="label" data-i="${i}" value="${(link.label || '').replace(/"/g, '&quot;')}">
          <label>Link URL</label>
          <input type="text" data-field="url" data-i="${i}" value="${(link.url || '').replace(/"/g, '&quot;')}" placeholder="https://...">
          <label>Icon</label>
          <div class="photo-row">
            <div class="photo-preview" id="linkIconPreview${i}" style="width:36px;height:36px;font-size:.7rem;">${
              link.icon && (link.icon.startsWith('http') || link.icon.startsWith('data:'))
                ? `<img src="${link.icon}">`
                : (link.icon || '')
            }</div>
            <input type="text" data-field="iconEmoji" data-i="${i}" placeholder="Paste an emoji, e.g. ⭐" style="max-width:140px;" value="${(link.icon && !link.icon.startsWith('http') && !link.icon.startsWith('data:')) ? link.icon : ''}">
            <button type="button" class="btn-file" data-upload="${i}">Upload icon</button>
            <input type="file" id="linkIconInput${i}" accept="image/*" style="display:none;">
          </div>
          <button type="button" class="remove-link" data-remove="${i}">Remove this link</button>
        `;
        linksList.appendChild(card);
      });

      linksList.querySelectorAll('input[data-field="label"]').forEach(function (el) {
        el.oninput = function () { links[+el.dataset.i].label = el.value; };
      });
      linksList.querySelectorAll('input[data-field="url"]').forEach(function (el) {
        el.oninput = function () { links[+el.dataset.i].url = el.value; };
      });
      linksList.querySelectorAll('input[data-field="iconEmoji"]').forEach(function (el) {
        el.oninput = function () {
          links[+el.dataset.i].icon = el.value;
          document.getElementById('linkIconPreview' + el.dataset.i).innerHTML = el.value;
        };
      });
      linksList.querySelectorAll('[data-upload]').forEach(function (btn) {
        btn.onclick = function () {
          document.getElementById('linkIconInput' + btn.dataset.upload).click();
        };
      });
      links.forEach(function (link, i) {
        const fileInput = document.getElementById('linkIconInput' + i);
        if (fileInput) {
          fileInput.onchange = function (e) {
            const file = e.target.files[0];
            if (!file) return;
            fileToDataURI(file, 120).then(function (uri) {
              links[i].icon = uri;
              document.getElementById('linkIconPreview' + i).innerHTML = `<img src="${uri}">`;
            });
          };
        }
      });
      linksList.querySelectorAll('[data-remove]').forEach(function (btn) {
        btn.onclick = function () {
          links.splice(+btn.dataset.remove, 1);
          renderLinks();
        };
      });
    }

    renderLinks();

    if (window.Sortable) {
      Sortable.create(linksList, {
        handle: '.drag-handle',
        animation: 150,
        onEnd: function (evt) {
          if (evt.oldIndex === evt.newIndex) return;
          const moved = links.splice(evt.oldIndex, 1)[0];
          links.splice(evt.newIndex, 0, moved);
          renderLinks();
        }
      });
    }

    document.getElementById('addLinkBtn').onclick = function () {
      links.push({ label: '', url: '', icon: '' });
      renderLinks();
    };

    // --- posts ---
    let postImageData = '';
    let editingPostId = null;
    document.getElementById('postImgBtn').onclick = function () {
      document.getElementById('postImgInput').click();
    };
    document.getElementById('postImgInput').onchange = function (e) {
      const file = e.target.files[0];
      if (!file) return;
      fileToDataURI(file, 640, 0.75).then(function (uri) {
        postImageData = uri;
        document.getElementById('postImgPreview').innerHTML = `<img src="${uri}">`;
      });
    };

    function renderPosts() {
      const postList = document.getElementById('postList');
      if (posts.length === 0) {
        postList.innerHTML = '<div class="empty-posts">No updates posted yet — offers or news you post here also show up on the Publik News feed on our website.</div>';
        return;
      }
      postList.innerHTML = posts.map(function (p) {
        return `
          <div class="post-item">
            ${p.pinned ? `<div class="pinned-badge">&#128204; Pinned</div>` : ''}
            ${p.image ? `<img src="${p.image}">` : ''}
            <div class="ptitle">${p.title}</div>
            ${p.body ? `<div class="pbody clamp-text">${p.body}</div>` : ''}
            <div class="pmeta">
              <div class="pwhen">${timeAgo(p.created_at)}</div>
              <div class="pactions">
                ${isPublikAccount ? `<button type="button" class="ppin${p.pinned ? ' is-pinned' : ''}" data-pinid="${p.id}">${p.pinned ? 'Unpin' : 'Pin'}</button>` : ''}
                <button type="button" class="pedit" data-editid="${p.id}">Edit</button>
                <button type="button" class="pdelete" data-delid="${p.id}">Delete</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      postList.querySelectorAll('.clamp-text').forEach(function (el) {
        if (el.scrollHeight > el.clientHeight + 2) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'read-more-btn';
          btn.textContent = 'Read more';
          btn.onclick = function () {
            const expanded = el.classList.toggle('expanded');
            btn.textContent = expanded ? 'Show less' : 'Read more';
          };
          el.insertAdjacentElement('afterend', btn);
        }
      });

      postList.querySelectorAll('[data-delid]').forEach(function (btn) {
        btn.onclick = function () {
          const postId = btn.dataset.delid;
          btn.disabled = true;
          btn.textContent = 'Deleting…';
          client.rpc('delete_post', { p_id: id, p_key: key, p_post_id: Number(postId) }).then(function (res) {
            if (!res.error && res.data) {
              posts = posts.filter(function (p) { return String(p.id) !== String(postId); });
              if (String(editingPostId) === String(postId)) cancelEdit();
              renderPosts();
            } else {
              btn.disabled = false;
              btn.textContent = 'Delete';
            }
          });
        };
      });

      postList.querySelectorAll('[data-editid]').forEach(function (btn) {
        btn.onclick = function () {
          const postId = btn.dataset.editid;
          const post = posts.find(function (p) { return String(p.id) === String(postId); });
          if (!post) return;
          startEdit(post);
        };
      });

      if (isPublikAccount) {
        postList.querySelectorAll('[data-pinid]').forEach(function (btn) {
          btn.onclick = function () {
            const postId = btn.dataset.pinid;
            const post = posts.find(function (p) { return String(p.id) === String(postId); });
            if (!post) return;
            const nextPinned = !post.pinned;
            btn.disabled = true;
            client.rpc('pin_post', { p_id: id, p_key: key, p_post_id: Number(postId), p_pinned: nextPinned }).then(function (res) {
              btn.disabled = false;
              if (!res.error && res.data) {
                loadPosts();
              }
            }).catch(function () {
              btn.disabled = false;
            });
          };
        });
      }
    }

    function startEdit(post) {
      editingPostId = post.id;
      document.getElementById('postTitleInput').value = post.title || '';
      document.getElementById('postBodyInput').value = post.body || '';
      document.getElementById('postLinkInput').value = post.link || '';
      postImageData = post.image || '';
      document.getElementById('postImgPreview').innerHTML = post.image ? `<img src="${post.image}">` : 'None';

      const publishBtn = document.getElementById('publishBtn');
      publishBtn.textContent = 'Save changes to this post';

      let cancelBtn = document.getElementById('cancelEditBtn');
      if (!cancelBtn) {
        cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.id = 'cancelEditBtn';
        cancelBtn.className = 'cancel-edit-btn';
        cancelBtn.textContent = 'Cancel edit';
        cancelBtn.onclick = cancelEdit;
        publishBtn.insertAdjacentElement('afterend', cancelBtn);
      }

      document.querySelector('.post-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function cancelEdit() {
      editingPostId = null;
      document.getElementById('postTitleInput').value = '';
      document.getElementById('postBodyInput').value = '';
      document.getElementById('postLinkInput').value = '';
      postImageData = '';
      document.getElementById('postImgPreview').innerHTML = 'None';
      document.getElementById('publishBtn').textContent = 'Publish update';
      const cancelBtn = document.getElementById('cancelEditBtn');
      if (cancelBtn) cancelBtn.remove();
    }

    function loadPosts() {
      client.from('posts_public').select('*').eq('card_id', id)
        .order('pinned', { ascending: false }).order('created_at', { ascending: false })
        .then(function (res) {
          posts = (res.data || []);
          renderPosts();
        });
    }
    loadPosts();

    document.getElementById('publishBtn').onclick = function () {
      const titleEl = document.getElementById('postTitleInput');
      const bodyEl = document.getElementById('postBodyInput');
      const linkEl = document.getElementById('postLinkInput');
      const postStatus = document.getElementById('postStatus');
      const publishBtn = document.getElementById('publishBtn');
      const title = titleEl.value.trim();
      const body = bodyEl.value.trim();
      const link = linkEl.value.trim();

      if (!title) {
        postStatus.textContent = 'Give your update a title.';
        postStatus.className = 'status err';
        return;
      }

      publishBtn.disabled = true;

      if (editingPostId) {
        postStatus.textContent = 'Saving…';
        postStatus.className = 'status';

        client.rpc('update_post', {
          p_id: id, p_key: key, p_post_id: Number(editingPostId),
          p_title: title, p_body: body, p_image: postImageData, p_link: link
        }).then(function (res) {
          publishBtn.disabled = false;
          if (res.error || !res.data) {
            postStatus.textContent = 'Could not save changes — try again.';
            postStatus.className = 'status err';
            return;
          }
          postStatus.textContent = 'Post updated.';
          postStatus.className = 'status ok';
          cancelEdit();
          loadPosts();
        }).catch(function () {
          publishBtn.disabled = false;
          postStatus.textContent = 'Something went wrong. Try again.';
          postStatus.className = 'status err';
        });
        return;
      }

      postStatus.textContent = 'Publishing…';
      postStatus.className = 'status';

      client.rpc('create_post', { p_id: id, p_key: key, p_title: title, p_body: body, p_image: postImageData, p_link: link })
        .then(function (res) {
          publishBtn.disabled = false;
          if (res.error || res.data === null) {
            postStatus.textContent = 'Could not publish — try again.';
            postStatus.className = 'status err';
            return;
          }
          postStatus.textContent = 'Posted — now live on Publik News.';
          postStatus.className = 'status ok';
          titleEl.value = '';
          bodyEl.value = '';
          linkEl.value = '';
          postImageData = '';
          document.getElementById('postImgPreview').innerHTML = 'None';
          loadPosts();
        }).catch(function () {
          publishBtn.disabled = false;
          postStatus.textContent = 'Something went wrong. Try again.';
          postStatus.className = 'status err';
        });
    };

    // --- save (business, photo, tagline, links, description together) ---
    document.getElementById('saveBtn').onclick = function () {
      const saveBtn = document.getElementById('saveBtn');
      const statusMsg = document.getElementById('statusMsg');
      saveBtn.disabled = true;
      statusMsg.textContent = 'Saving…';
      statusMsg.className = 'status';

      const business = document.getElementById('businessInput').value.trim();
      const tagline = document.getElementById('taglineInput').value.trim();
      const description = document.getElementById('descriptionInput').value.trim();
      const locationUrl = document.getElementById('locationInput').value.trim();
      const cleanLinks = links.filter(function (l) { return l.label && l.url; });

      client.rpc('upsert_card', {
        p_id: id, p_key: key, p_business: business, p_tagline: tagline,
        p_photo: photoData, p_links: cleanLinks, p_description: description,
        p_location_url: locationUrl
      }).then(function (res) {
        saveBtn.disabled = false;
        if (res.error || res.data === false) {
          statusMsg.textContent = 'Could not save — your access key may be invalid.';
          statusMsg.className = 'status err';
        } else {
          statusMsg.textContent = 'Saved. Your page is live.';
          statusMsg.className = 'status ok';
        }
      }).catch(function () {
        saveBtn.disabled = false;
        statusMsg.textContent = 'Something went wrong. Try again.';
        statusMsg.className = 'status err';
      });
    };
  }

  Promise.all([
    client.rpc('card_exists', { p_id: id }),
    client.rpc('get_points_enabled')
  ]).then(function (results) {
    const existsRes = results[0];
    const flagRes = results[1];
    pointsEnabled = !flagRes.error && flagRes.data === true;

    if (existsRes.error) {
      showMessage("Couldn't reach the server. Check your connection and reload.");
      return;
    }

    if (!existsRes.data) {
      // Brand new id — nothing to load yet, show a blank form.
      // Saving will create the card and lock it to this key.
      renderForm({ business: '', tagline: '', photo: '', links: [], description: '', location_url: '' });
      return;
    }

    client.rpc('get_card_for_edit', { p_id: id, p_key: key }).then(function (res) {
      if (res.error || !res.data || res.data.length === 0) {
        showMessage("This edit link isn't valid. Contact Publik for a new one.");
        return;
      }
      renderForm(res.data[0]);
    }).catch(function () {
      showMessage("Couldn't reach the server. Check your connection and reload.");
    });
  }).catch(function () {
    showMessage("Couldn't reach the server. Check your connection and reload.");
  });
})();
</script>

</body>
</html>
