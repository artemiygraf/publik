<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publik — Stats</title>
<style>
  :root{
    --bg:#06060B;
    --ink:#F5F5F2;
    --ink-soft:#9C9AA8;
    --lime:#D6FF3F;
    --border:rgba(255,255,255,.14);
    --card-bg:#111116;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:6vh 6vw 10vh;
  }
  .wrap{ max-width:460px; margin:0 auto; }
  .badge{
    width:44px; height:44px; background:var(--lime); border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#111; margin-bottom:18px;
  }
  h1{ font-size:1.3rem; font-weight:800; margin-bottom:4px; }
  .hint{ color:var(--ink-soft); font-size:.85rem; margin-bottom:28px; }

  .summary-row{ display:flex; gap:.9rem; margin-bottom:1.8rem; }
  .summary{
    flex:1;
    background:var(--card-bg); border:1px solid var(--border); border-radius:14px;
    padding:1.2rem 1.3rem;
  }
  .summary .big{ font-size:1.9rem; font-weight:800; color:var(--lime); }
  .summary .label{ color:var(--ink-soft); font-size:.78rem; margin-top:.2rem; }

  table{ width:100%; border-collapse:collapse; }
  th{
    text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-soft); font-weight:700; padding:0 0 .6rem; border-bottom:1px solid var(--border);
  }
  td{
    padding:.8rem 0; border-bottom:1px solid var(--border); font-size:.92rem;
  }
  td.count{ text-align:right; font-weight:800; color:var(--lime); }
  td.when{ text-align:right; color:var(--ink-soft); font-size:.8rem; }

  .empty{
    color:var(--ink-soft); font-size:.9rem; border:1px dashed var(--border);
    border-radius:12px; padding:1.4rem 1.6rem;
  }
  .center-msg{ text-align:center; padding-top:12vh; color:var(--ink-soft); }

  .section{ margin-top:2.2rem; }
  .section-title{
    font-size:.78rem; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-soft); font-weight:700; margin-bottom:1rem;
  }
  .chart{
    display:flex; align-items:flex-end; gap:5px; height:110px;
    border-bottom:1px solid var(--border); padding-bottom:2px;
  }
  .chart-col{
    flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-end; height:100%; min-width:0;
  }
  .chart-bar{
    width:100%; max-width:26px; background:var(--lime); border-radius:3px 3px 0 0; min-height:2px;
  }
  .chart-labels{ display:flex; gap:5px; margin-top:6px; }
  .chart-labels span{
    flex:1; text-align:center; font-size:.62rem; color:var(--ink-soft); min-width:0;
  }
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="center-msg" id="state">Loading&hellip;</div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const key = params.get('key');
  const wrap = document.getElementById('wrap');

  function supabaseConfigured() {
    const c = window.PUBLIK_CONFIG || {};
    return c.SUPABASE_URL && c.SUPABASE_ANON_KEY &&
      !c.SUPABASE_URL.includes('PASTE_') && !c.SUPABASE_ANON_KEY.includes('PASTE_');
  }

  function showMessage(text) {
    wrap.innerHTML = `<div class="center-msg">${text}</div>`;
  }

  if (!id || !key) {
    showMessage("This stats link is missing its access key. Ask Publik for your full link.");
    return;
  }

  if (!supabaseConfigured() || !window.supabase) {
    showMessage("Stats aren't connected yet. Ask Publik to finish setup.");
    return;
  }

  const client = window.supabase.createClient(window.PUBLIK_CONFIG.SUPABASE_URL, window.PUBLIK_CONFIG.SUPABASE_ANON_KEY);

  function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + 'h ago';
    const days = Math.floor(hours / 24);
    return days + 'd ago';
  }

  function barChartHtml(items) {
    const max = Math.max(1, ...items.map(i => i.value));
    const bars = items.map(i => `
      <div class="chart-col">
        <div class="chart-bar" style="height:${Math.round((i.value / max) * 100)}%;" title="${i.value}"></div>
      </div>
    `).join('');
    const labels = items.map(i => `<span>${i.label}</span>`).join('');
    return `<div class="chart">${bars}</div><div class="chart-labels">${labels}</div>`;
  }

  function buildTrend(events) {
    // Last 14 calendar days of taps (page views), including days with zero.
    const dayCounts = {};
    events.forEach(function (e) {
      if (e.link_label !== '__page_view__') return;
      const d = new Date(e.clicked_at);
      const key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      dayCounts[key] = (dayCounts[key] || 0) + 1;
    });

    const items = [];
    const today = new Date();
    for (let i = 13; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      items.push({
        label: (d.getMonth() + 1) + '/' + d.getDate(),
        value: dayCounts[key] || 0
      });
    }
    return items;
  }

  function buildWeekdayPattern(events) {
    const names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const counts = [0, 0, 0, 0, 0, 0, 0];
    events.forEach(function (e) {
      if (e.link_label !== '__page_view__') return;
      counts[new Date(e.clicked_at).getDay()]++;
    });
    return names.map((n, i) => ({ label: n, value: counts[i] }));
  }

  function renderStats(statRows, events) {
    const pageView = statRows.find(r => r.link_label === '__page_view__');
    const linkRows = statRows.filter(r => r.link_label !== '__page_view__');
    const totalTaps = pageView ? pageView.click_count : 0;
    const totalLinkClicks = linkRows.reduce((sum, r) => sum + Number(r.click_count), 0);
    const engagement = totalTaps > 0 ? Math.round((totalLinkClicks / totalTaps) * 100) : null;

    const rowsHtml = linkRows.length
      ? linkRows.map(r => `
          <tr>
            <td>${r.link_label}</td>
            <td class="count">${r.click_count}</td>
            <td class="when">${timeAgo(r.last_clicked)}</td>
          </tr>
        `).join('')
      : '';

    const hasEnoughForCharts = events.length > 0;

    wrap.innerHTML = `
      <div class="badge">P</div>
      <h1>Card stats</h1>
      <div class="hint">Only visible to you, via your own edit link.</div>

      <div class="summary-row">
        <div class="summary">
          <div class="big">${totalTaps}</div>
          <div class="label">Total taps</div>
        </div>
        <div class="summary">
          <div class="big">${engagement === null ? '—' : engagement + '%'}</div>
          <div class="label">Link clicks per tap</div>
        </div>
      </div>

      ${linkRows.length ? `
        <table>
          <thead>
            <tr><th>Link</th><th style="text-align:right;">Clicks</th><th style="text-align:right;">Last</th></tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      ` : `<div class="empty">No link clicks yet — once visitors start tapping the buttons on your page, they'll show up here.</div>`}

      ${hasEnoughForCharts ? `
        <div class="section">
          <div class="section-title">Taps, last 14 days</div>
          ${barChartHtml(buildTrend(events))}
        </div>

        <div class="section">
          <div class="section-title">Taps by day of week</div>
          ${barChartHtml(buildWeekdayPattern(events))}
        </div>
      ` : ''}
    `;
  }

  client.rpc('card_exists', { p_id: id }).then(function (existsRes) {
    if (existsRes.error) {
      showMessage("Couldn't reach the server. Check your connection and reload.");
      return;
    }
    if (!existsRes.data) {
      showMessage("No data for this card yet.");
      return;
    }

    client.rpc('get_card_for_edit', { p_id: id, p_key: key }).then(function (authRes) {
      if (authRes.error || !authRes.data || authRes.data.length === 0) {
        showMessage("This stats link isn't valid. Contact Publik for a new one.");
        return;
      }

      Promise.all([
        client.rpc('get_click_stats', { p_id: id, p_key: key }),
        client.rpc('get_click_events', { p_id: id, p_key: key })
      ]).then(function (results) {
        const statsRes = results[0];
        const eventsRes = results[1];
        if (statsRes.error || eventsRes.error) {
          showMessage("Couldn't load stats. Try again.");
          return;
        }
        renderStats(statsRes.data || [], eventsRes.data || []);
      }).catch(function () {
        showMessage("Couldn't load stats. Try again.");
      });
    }).catch(function () {
      showMessage("Couldn't reach the server. Check your connection and reload.");
    });
  }).catch(function () {
    showMessage("Couldn't reach the server. Check your connection and reload.");
  });
})();
</script>

</body>
</html>
