<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publik — Admin</title>
<style>
  :root{
    --bg:#06060B;
    --ink:#F5F5F2;
    --ink-soft:#9C9AA8;
    --lime:#D6FF3F;
    --border:rgba(255,255,255,.14);
    --card-bg:#111116;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:6vh 6vw 10vh;
  }
  .wrap{ max-width:760px; margin:0 auto; }
  .badge{
    width:44px; height:44px; background:var(--lime); border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#111; margin-bottom:18px;
  }
  h1{ font-size:1.3rem; font-weight:800; margin-bottom:4px; }
  .hint{ color:var(--ink-soft); font-size:.85rem; margin-bottom:28px; }

  .summary-row{ display:flex; gap:.9rem; margin-bottom:1.8rem; flex-wrap:wrap; }
  .summary{
    flex:1; min-width:120px;
    background:var(--card-bg); border:1px solid var(--border); border-radius:14px;
    padding:1.2rem 1.3rem;
  }
  .summary .big{ font-size:1.9rem; font-weight:800; color:var(--lime); }
  .summary .label{ color:var(--ink-soft); font-size:.78rem; margin-top:.2rem; }

  .client-card{
    background:var(--card-bg); border:1px solid var(--border); border-radius:14px;
    padding:1.3rem 1.5rem; margin-bottom:.9rem;
  }
  .client-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap; }
  .client-name{ font-weight:800; font-size:1.05rem; }
  .client-tagline{ color:var(--ink-soft); font-size:.85rem; margin-top:.2rem; }
  .client-id{ color:#5A5850; font-size:.72rem; margin-top:.3rem; font-family:monospace; }
  .client-stats{ display:flex; gap:1.4rem; flex-shrink:0; }
  .client-stat .n{ font-weight:800; color:var(--lime); font-size:1.1rem; text-align:right; }
  .client-stat .l{ color:var(--ink-soft); font-size:.7rem; text-align:right; }

  .client-links{ display:flex; gap:.6rem; margin-top:1rem; flex-wrap:wrap; }
  .client-links a{
    color:var(--ink); text-decoration:none; font-size:.8rem; font-weight:700;
    border:1px solid var(--border); border-radius:8px; padding:.4rem .8rem;
  }
  .client-links a:hover{ border-color:var(--lime); color:var(--lime); }

  .empty{
    color:var(--ink-soft); font-size:.9rem; border:1px dashed var(--border);
    border-radius:12px; padding:1.4rem 1.6rem;
  }
  .center-msg{ text-align:center; padding-top:12vh; color:var(--ink-soft); }

  .toggle-card{
    background:var(--card-bg); border:1px solid var(--border); border-radius:14px;
    padding:1.2rem 1.5rem; margin-bottom:1.8rem;
    display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;
  }
  .toggle-card .t-name{ font-weight:800; font-size:1rem; }
  .toggle-card .t-desc{ color:var(--ink-soft); font-size:.82rem; margin-top:.2rem; max-width:440px; }
  .toggle-btn{
    flex-shrink:0; padding:.7rem 1.3rem; border-radius:10px; border:1px solid var(--border);
    background:none; color:var(--ink); font-weight:800; font-size:.85rem; cursor:pointer;
  }
  .toggle-btn.is-on{ background:var(--lime); border-color:var(--lime); color:#111; }
  .toggle-btn:disabled{ opacity:.5; cursor:default; }
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="center-msg" id="state">Loading&hellip;</div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const adminKey = params.get('key');
  const wrap = document.getElementById('wrap');

  function supabaseConfigured() {
    const c = window.PUBLIK_CONFIG || {};
    return c.SUPABASE_URL && c.SUPABASE_ANON_KEY &&
      !c.SUPABASE_URL.includes('PASTE_') && !c.SUPABASE_ANON_KEY.includes('PASTE_');
  }

  function showMessage(text) {
    wrap.innerHTML = `<div class="center-msg">${text}</div>`;
  }

  if (!adminKey) {
    showMessage("This admin link is missing its key.");
    return;
  }

  if (!supabaseConfigured() || !window.supabase) {
    showMessage("Admin panel isn't connected yet.");
    return;
  }

  const client = window.supabase.createClient(window.PUBLIK_CONFIG.SUPABASE_URL, window.PUBLIK_CONFIG.SUPABASE_ANON_KEY);

  function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + 'h ago';
    const days = Math.floor(hours / 24);
    return days + 'd ago';
  }

  function renderDashboard(rows, pointsEnabled) {
    const totalClients = rows.length;
    const totalTaps = rows.reduce((sum, r) => sum + Number(r.taps), 0);
    const totalClicks = rows.reduce((sum, r) => sum + Number(r.link_clicks), 0);

    const cardsHtml = rows.length ? rows.map(r => {
      const name = r.business || `Unnamed card (${r.id})`;
      const viewUrl = `p.html?id=${encodeURIComponent(r.id)}`;
      const editUrl = `edit.html?id=${encodeURIComponent(r.id)}&key=${encodeURIComponent(r.edit_key)}`;
      const statsUrl = `stats.html?id=${encodeURIComponent(r.id)}&key=${encodeURIComponent(r.edit_key)}`;
      return `
        <div class="client-card">
          <div class="client-top">
            <div>
              <div class="client-name">${name}</div>
              ${r.tagline ? `<div class="client-tagline">${r.tagline}</div>` : ''}
              <div class="client-id">id: ${r.id} &middot; updated ${timeAgo(r.updated_at)}</div>
            </div>
            <div class="client-stats">
              <div class="client-stat"><div class="n">${r.taps}</div><div class="l">taps</div></div>
              <div class="client-stat"><div class="n">${r.link_clicks}</div><div class="l">clicks</div></div>
            </div>
          </div>
          <div class="client-links">
            <a href="${viewUrl}" target="_blank">View card</a>
            <a href="${editUrl}" target="_blank">Edit link</a>
            <a href="${statsUrl}" target="_blank">Stats</a>
          </div>
        </div>
      `;
    }).join('') : `<div class="empty">No clients onboarded yet — once you create a card, it'll show up here.</div>`;

    wrap.innerHTML = `
      <div class="badge">P</div>
      <h1>All clients</h1>
      <div class="hint">Visible only with the admin key.</div>

      <div class="toggle-card">
        <div>
          <div class="t-name">Customer rewards system</div>
          <div class="t-desc" id="pointsToggleDesc">${pointsEnabled ? 'Live — customers can earn and save points, businesses can redeem them.' : 'Hidden — "Your Profile", the tap rewards, and each business\'s Redeem tab are all switched off.'}</div>
        </div>
        <button type="button" class="toggle-btn${pointsEnabled ? ' is-on' : ''}" id="pointsToggleBtn">${pointsEnabled ? 'On — tap to hide' : 'Off — tap to launch'}</button>
      </div>

      <div class="summary-row">
        <div class="summary"><div class="big">${totalClients}</div><div class="label">Clients</div></div>
        <div class="summary"><div class="big">${totalTaps}</div><div class="label">Total taps</div></div>
        <div class="summary"><div class="big">${totalClicks}</div><div class="label">Total link clicks</div></div>
      </div>

      ${cardsHtml}
    `;

    let currentlyEnabled = pointsEnabled;
    const toggleBtn = document.getElementById('pointsToggleBtn');
    const toggleDesc = document.getElementById('pointsToggleDesc');
    toggleBtn.onclick = function () {
      const next = !currentlyEnabled;
      toggleBtn.disabled = true;
      toggleBtn.textContent = 'Saving…';
      client.rpc('admin_set_points_enabled', { p_admin_key: adminKey, p_enabled: next }).then(function (res) {
        toggleBtn.disabled = false;
        if (res.error || !res.data) {
          toggleBtn.textContent = currentlyEnabled ? 'On — tap to hide' : 'Off — tap to launch';
          return;
        }
        currentlyEnabled = next;
        toggleBtn.classList.toggle('is-on', currentlyEnabled);
        toggleBtn.textContent = currentlyEnabled ? 'On — tap to hide' : 'Off — tap to launch';
        toggleDesc.textContent = currentlyEnabled
          ? 'Live — customers can earn and save points, businesses can redeem them.'
          : 'Hidden — "Your Profile", the tap rewards, and each business\'s Redeem tab are all switched off.';
      }).catch(function () {
        toggleBtn.disabled = false;
        toggleBtn.textContent = currentlyEnabled ? 'On — tap to hide' : 'Off — tap to launch';
      });
    };
  }

  client.rpc('admin_verify', { p_admin_key: adminKey }).then(function (verifyRes) {
    if (verifyRes.error) {
      showMessage("Couldn't reach the server. Check your connection and reload.");
      return;
    }
    if (!verifyRes.data) {
      showMessage("Invalid admin key.");
      return;
    }

    Promise.all([
      client.rpc('admin_list_cards', { p_admin_key: adminKey }),
      client.rpc('get_points_enabled')
    ]).then(function (results) {
      const listRes = results[0];
      const flagRes = results[1];
      if (listRes.error) {
        showMessage("Couldn't load clients. Try again.");
        return;
      }
      renderDashboard(listRes.data || [], !flagRes.error && flagRes.data === true);
    }).catch(function () {
      showMessage("Couldn't load clients. Try again.");
    });
  }).catch(function () {
    showMessage("Couldn't reach the server. Check your connection and reload.");
  });
})();
</script>

</body>
</html>
