<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publik — Tap</title>
<style>
  :root{
    --bg:#06060B;
    --ink:#F5F5F2;
    --ink-soft:#9C9AA8;
    --lime:#D6FF3F;
    --border:rgba(255,255,255,.14);
    --card-bg:#111116;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6vh 6vw;
  }
  .wrap{
    width:100%;
    max-width:380px;
    text-align:center;
  }
  .badge{
    width:64px;
    height:64px;
    background:var(--lime);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 20px;
    font-weight:800;
    font-size:1.5rem;
    color:#111;
    overflow:hidden;
  }
  .badge img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  h1{
    font-size:1.4rem;
    font-weight:800;
    margin-bottom:6px;
  }
  .tagline{
    color:var(--ink-soft);
    font-size:.92rem;
    margin-bottom:30px;
    line-height:1.5;
  }
  .sub{
    color:var(--ink-soft);
    font-size:.9rem;
    margin-bottom:32px;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  a.link-btn{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card-bg);
    border:1px solid var(--border);
    color:var(--ink);
    text-decoration:none;
    padding:14px 16px;
    border-radius:12px;
    font-weight:700;
    font-size:.98rem;
    text-align:left;
    transition:border-color .15s ease, transform .1s ease;
    opacity:0;
    transform:translateY(6px);
    animation:rise .5s ease forwards;
  }
  a.link-btn:nth-child(1){ animation-delay:.05s; }
  a.link-btn:nth-child(2){ animation-delay:.15s; }
  a.link-btn:nth-child(3){ animation-delay:.25s; }
  a.link-btn:nth-child(4){ animation-delay:.35s; }
  a.link-btn:nth-child(5){ animation-delay:.45s; }
  a.link-btn:nth-child(6){ animation-delay:.55s; }
  a.link-btn:active{
    transform:scale(.97);
  }
  a.link-btn:hover{
    border-color:var(--lime);
  }
  .link-icon{
    width:28px;
    height:28px;
    border-radius:8px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1rem;
    background:rgba(255,255,255,.06);
    overflow:hidden;
  }
  .link-icon img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  @keyframes rise{
    to{ opacity:1; transform:translateY(0); }
  }
  .footline{
    margin-top:36px;
    font-size:.75rem;
    color:#5A5850;
  }
  .footline a{
    color:#5A5850;
  }
  .state{
    color:var(--ink-soft);
    font-size:.9rem;
  }
  .rewards-note{
    margin-top:20px;
    font-size:.82rem;
    color:var(--ink-soft);
    line-height:1.6;
    text-align:center;
  }
  .rewards-note b{ color:var(--lime); }
  .rewards-note button.link-inline{
    background:none;
    border:none;
    color:var(--lime);
    text-decoration:underline;
    font-size:.82rem;
    font-family:inherit;
    cursor:pointer;
    padding:0;
  }
  .rewards-note input[type=text]{
    margin-top:8px;
    width:100%;
    background:var(--card-bg);
    border:1px solid var(--border);
    color:var(--ink);
    padding:8px 10px;
    border-radius:8px;
    font-size:.85rem;
    font-family:inherit;
  }
  .rewards-note .restore-row button.primary:disabled{
    opacity:.4;
    cursor:not-allowed;
  }
  .rewards-note .restore-row{
    margin-top:10px;
    display:flex;
    gap:8px;
  }
  .rewards-note .restore-row button.primary{
    background:var(--lime);
    color:#111;
    border:none;
    border-radius:8px;
    padding:8px 14px;
    font-weight:700;
    font-size:.82rem;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
  }
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="badge">P</div>
  <div class="state" id="state">Loading&hellip;</div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const wrap = document.getElementById('wrap');
  let client = null;

  function rewardsNoteEl() {
    return document.getElementById('rewardsNote');
  }

  function currentToken() {
    return localStorage.getItem('publik_customer_token');
  }

  function showTapResult(points, awarded) {
    const el = rewardsNoteEl();
    if (!el) return;
    const headline = awarded
      ? `<b>+1</b> point earned. You have <b>${points}</b> total.`
      : `You've already earned today's point here. <b>${points}</b> points total.`;
    el.innerHTML = `
      ${headline}
      <div style="margin-top:8px;">Save your points for next time? Enter your email:</div>
      <div class="restore-row">
        <input type="text" id="emailInput" placeholder="name@email.com" maxlength="120">
        <button type="button" class="primary" id="emailSubmitBtn" disabled>Save</button>
      </div>
      <label style="display:flex;align-items:flex-start;gap:6px;margin-top:8px;font-size:.72rem;color:#5A5850;text-align:left;">
        <input type="checkbox" id="emailConsentCheck" style="margin-top:2px;flex-shrink:0;">
        <span>I agree to share my email so Publik can save and restore my reward points. It won't be used for anything else.</span>
      </label>
      <div class="status" id="emailStatus" style="margin-top:6px;font-size:.72rem;color:#D85A30;"></div>
    `;
    const btn = document.getElementById('emailSubmitBtn');
    const consentCheck = document.getElementById('emailConsentCheck');
    if (consentCheck && btn) {
      consentCheck.addEventListener('change', function () {
        btn.disabled = !consentCheck.checked;
      });
    }
    if (btn) {
      btn.addEventListener('click', function () {
        const input = document.getElementById('emailInput');
        const status = document.getElementById('emailStatus');
        const email = (input && input.value ? input.value : '').trim();
        if (!consentCheck || !consentCheck.checked) {
          if (status) status.textContent = 'Please check the box to agree first.';
          return;
        }
        if (!email || email.indexOf('@') === -1) {
          if (status) status.textContent = 'Enter a valid email first.';
          return;
        }
        if (status) status.textContent = '';
        btn.disabled = true;
        btn.textContent = 'Saving…';
        handleEmailSubmit(email);
      });
    }
  }

  function handleEmailSubmit(email) {
    if (!client) return;
    const el = rewardsNoteEl();
    Promise.resolve(client.rpc('restore_customer_by_email', { p_email: email })).then(function (res) {
      if (!res.error && res.data && res.data[0]) {
        const row = res.data[0];
        localStorage.setItem('publik_customer_token', row.token);
        return Promise.resolve(client.rpc('award_tap_points', { p_token: row.token, p_card_id: id })).then(function (awardRes) {
          const pts = (!awardRes.error && awardRes.data && awardRes.data[0]) ? awardRes.data[0].points : row.points;
          if (el) el.innerHTML = `Welcome back — you have <b>${pts}</b> points.`;
        });
      }
      const token = currentToken();
      if (!token) return;
      return Promise.resolve(client.rpc('save_customer_email', { p_token: token, p_email: email, p_consent_version: 'v1' })).then(function (saveRes) {
        if (el) {
          el.innerHTML = (!saveRes.error && saveRes.data)
            ? `Saved — we'll remember you next time you tap.`
            : `Couldn't save that email. Try again.`;
        }
      });
    }).catch(function () {
      if (el) el.innerHTML = `Couldn't reach the server. Try again.`;
    });
  }

  function awardReviewPoints(done) {
    const finish = done || function () {};
    if (!client) { finish(); return; }
    const token = currentToken();
    if (!token) { finish(); return; }
    Promise.resolve(client.rpc('award_review_points', { p_token: token, p_card_id: id })).then(function (res) {
      if (!res.error && res.data && res.data[0] && res.data[0].awarded) {
        const el = rewardsNoteEl();
        if (el) el.innerHTML = `Thanks for the review — <b>+1</b> bonus point! You have <b>${res.data[0].points}</b> total.`;
      }
      finish();
    }).catch(finish);
  }

  function showRewardsDebug(label, err) {
    console.error('Publik rewards debug —', label, err);
    const el = rewardsNoteEl();
    if (el) {
      el.innerHTML = `<span style="color:#D85A30;">Rewards debug: ${label} — ${err && err.message ? err.message : JSON.stringify(err)}</span>`;
    }
  }

  function awardTapPoints() {
    if (!client) return;
    try {
      const existingToken = currentToken();
      if (existingToken) {
        Promise.resolve(client.rpc('award_tap_points', { p_token: existingToken, p_card_id: id })).then(function (res) {
          if (res.error) { showRewardsDebug('award_tap_points (existing token) errored', res.error); return; }
          if (!res.data || !res.data[0]) { showRewardsDebug('award_tap_points (existing token) empty result', res); return; }
          showTapResult(res.data[0].points, res.data[0].awarded);
        }).catch(function (e) { showRewardsDebug('award_tap_points (existing token) threw', e); });
      } else {
        Promise.resolve(client.rpc('create_customer')).then(function (res) {
          if (res.error) { showRewardsDebug('create_customer errored', res.error); return; }
          if (!res.data || !res.data[0]) { showRewardsDebug('create_customer empty result', res); return; }
          const token = res.data[0].token;
          localStorage.setItem('publik_customer_token', token);
          return Promise.resolve(client.rpc('award_tap_points', { p_token: token, p_card_id: id })).then(function (awardRes) {
            if (awardRes.error) { showRewardsDebug('award_tap_points (new token) errored', awardRes.error); return; }
            if (!awardRes.data || !awardRes.data[0]) { showRewardsDebug('award_tap_points (new token) empty result', awardRes); return; }
            showTapResult(awardRes.data[0].points, awardRes.data[0].awarded);
          });
        }).catch(function (e) { showRewardsDebug('create_customer threw', e); });
      }
    } catch (e) {
      console.error('Publik: awardTapPoints failed', e);
    }
  }

  function renderError(debugInfo) {
    wrap.innerHTML = `
      <div class="badge">P</div>
      <h1>Link not set up yet</h1>
      <div class="sub">This card hasn't been assigned any destinations. Contact the business or Publik to get this fixed.</div>
      <div class="footline">Publik &middot; publik.link</div>
      ${debugInfo ? `<div class="footline" style="margin-top:14px;word-break:break-all;color:#888;">DEBUG: ${debugInfo}</div>` : ''}
    `;
  }

  function iconHtml(icon) {
    if (!icon) return '';
    if (icon.startsWith('http') || icon.startsWith('data:')) {
      return `<span class="link-icon"><img src="${icon}" alt=""></span>`;
    }
    return `<span class="link-icon">${icon}</span>`;
  }

  function logEvent(linkLabel) {
    const c = window.PUBLIK_CONFIG || {};
    if (!c.SUPABASE_URL || !c.SUPABASE_ANON_KEY || c.SUPABASE_URL.includes('PASTE_')) return;
    try {
      fetch(c.SUPABASE_URL + '/rest/v1/rpc/log_click', {
        method: 'POST',
        keepalive: true,
        headers: {
          'Content-Type': 'application/json',
          'apikey': c.SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + c.SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ p_card_id: id, p_link_label: linkLabel })
      });
    } catch (e) {}
  }

  function renderCard(data) {
    const photoHtml = data.photo
      ? `<img src="${data.photo}" alt="">`
      : (data.business ? data.business.charAt(0).toUpperCase() : 'P');

    const linksHtml = (data.links || []).map(l => {
      const isReview = l.url && l.url.indexOf('review.html') !== -1;
      return `<a class="link-btn" href="${l.url}" target="_top" data-label="${l.label.replace(/"/g, '&quot;')}"${isReview ? ' data-review="1"' : ''}>${iconHtml(l.icon)}<span>${l.label}</span></a>`;
    }).join('');

    const locationHtml = data.location_url
      ? `<a class="link-btn" href="${data.location_url}" target="_top" data-label="Get directions">${iconHtml('📍')}<span>Get directions</span></a>`
      : '';

    wrap.innerHTML = `
      <div class="badge">${photoHtml}</div>
      <h1>${data.business || 'Welcome'}</h1>
      ${data.tagline ? `<div class="tagline">${data.tagline}</div>` : `<div class="sub">Choose where you'd like to go</div>`}
      <div class="links">${linksHtml}${locationHtml}</div>
      <div class="rewards-note" id="rewardsNote"></div>
      <div class="footline">Powered by <a href="https://publik.tech/">Publik</a></div>
    `;

    wrap.querySelectorAll('.link-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        logEvent(btn.dataset.label || 'link');
        if (btn.dataset.review === '1') {
          e.preventDefault();
          const targetUrl = btn.getAttribute('href');
          let navigated = false;
          const go = function () {
            if (navigated) return;
            navigated = true;
            window.top.location.href = targetUrl;
          };
          awardReviewPoints(go);
          setTimeout(go, 600);
        }
      });
    });

    logEvent('__page_view__');
    awardTapPoints();
  }

  function loadLocalFallback(debugInfo) {
    fetch('data/' + encodeURIComponent(id) + '.json')
      .then(function (res) {
        if (!res.ok) throw new Error('not found');
        return res.json();
      })
      .then(renderCard)
      .catch(function () { renderError(debugInfo); });
  }

  function supabaseConfigured() {
    const c = window.PUBLIK_CONFIG || {};
    return c.SUPABASE_URL && c.SUPABASE_ANON_KEY &&
      !c.SUPABASE_URL.includes('PASTE_') && !c.SUPABASE_ANON_KEY.includes('PASTE_');
  }

  if (!id) {
    renderError();
    return;
  }

  if (supabaseConfigured() && window.supabase) {
    client = window.supabase.createClient(window.PUBLIK_CONFIG.SUPABASE_URL, window.PUBLIK_CONFIG.SUPABASE_ANON_KEY);
    client.from('cards_public').select('*').eq('id', id).single()
      .then(function (res) {
        if (res.error || !res.data) {
          console.error('Publik: cards_public query returned error', res.error);
          loadLocalFallback('query error — ' + (res.error ? (res.error.message || res.error.code || JSON.stringify(res.error)) : 'no data returned'));
        } else {
          renderCard(res.data);
        }
      })
      .catch(function (e) {
        console.error('Publik: cards_public query threw', e);
        loadLocalFallback('query threw — ' + (e && e.message ? e.message : String(e)));
      });
  } else {
    loadLocalFallback('supabase not configured or library missing — configured=' + supabaseConfigured() + ' lib=' + (typeof window.supabase));
  }
})();
</script>

</body>
</html>
